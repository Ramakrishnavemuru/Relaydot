<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Real-Time Chat</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-primary); padding: 1.5rem;">
  <div class="modal-card" style="width: 100%; max-width: 520px;">
    <div class="modal-header">
      <h3 class="modal-title">My Profile</h3>
      <a href="chat.html" class="btn btn-sm btn-secondary">← Back to Chat</a>
    </div>
    <div class="modal-body">
      <div class="avatar-upload-wrap" style="justify-content: center; flex-direction: column; text-align: center; margin-bottom: 2rem;">
        <img id="profile-page-avatar" src="" class="avatar-preview-img" style="width: 96px; height: 96px;" />
        <label class="btn btn-sm btn-secondary" style="cursor: pointer; margin-top: 0.75rem;">
          Upload New Picture
          <input type="file" id="profile-page-file-input" class="hidden" accept="image/*" />
        </label>
      </div>

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="profile-page-username" class="form-input" disabled style="opacity: 0.7;" />
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="profile-page-email" class="form-input" disabled style="opacity: 0.7;" />
      </div>

      <div class="form-group">
        <label class="form-label">Display Name</label>
        <input type="text" id="profile-page-display-name" class="form-input" placeholder="Your display name" />
      </div>

      <div class="form-group">
        <label class="form-label">Bio</label>
        <textarea id="profile-page-bio" class="form-textarea" placeholder="Tell everyone something about yourself..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <a href="chat.html" class="btn btn-secondary">Cancel</a>
      <button id="btn-save-profile-page" class="btn btn-primary">Save Changes</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
  <script>
    if (Auth.requireAuth()) {
      const user = Auth.getCurrentUser();
      const avatarEl = document.getElementById('profile-page-avatar');
      const usernameEl = document.getElementById('profile-page-username');
      const emailEl = document.getElementById('profile-page-email');
      const displayNameEl = document.getElementById('profile-page-display-name');
      const bioEl = document.getElementById('profile-page-bio');
      const fileInput = document.getElementById('profile-page-file-input');
      const saveBtn = document.getElementById('btn-save-profile-page');

      let currentAvatarUrl = user.avatar_url;

      avatarEl.src = API.resolveUrl(user.avatar_url) || `https://api.dicebear.com/7.x/initials/svg?seed=${user.username}`;
      usernameEl.value = '@' + user.username;
      emailEl.value = user.email || '';
      displayNameEl.value = user.display_name || '';
      bioEl.value = user.bio || '';

      fileInput.addEventListener('change', async (e) => {
        if (e.target.files && e.target.files[0]) {
          try {
            const url = await ProfileManager.uploadAvatar(e.target.files[0]);
            currentAvatarUrl = url;
            avatarEl.src = API.resolveUrl(url);
            Utils.showToast('Avatar uploaded! Click Save to apply.', 'info');
          } catch (err) {}
        }
      });

      saveBtn.addEventListener('click', async () => {
        saveBtn.disabled = true;
        try {
          await ProfileManager.updateProfile(
            displayNameEl.value.trim(),
            bioEl.value.trim(),
            currentAvatarUrl
          );
          setTimeout(() => window.location.href = 'chat.html', 700);
        } catch (err) {
          saveBtn.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
